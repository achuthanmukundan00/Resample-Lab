<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>
  <rect width="200" height="200" rx="28" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Fractured waveform blocks -->
  <!-- Block group 1: rising slices left -->
  <rect x="36" y="118" width="8" height="8" rx="1" fill="url(#accent)" opacity="0.35"/>
  <rect x="46" y="108" width="8" height="12" rx="1" fill="url(#accent)" opacity="0.45"/>
  <rect x="56" y="96" width="8" height="18" rx="1" fill="url(#accent)" opacity="0.55"/>
  <rect x="66" y="82" width="8" height="26" rx="1" fill="url(#accent)" opacity="0.65"/>
  <rect x="76" y="66" width="8" height="36" rx="1" fill="url(#accent)" opacity="0.75"/>
  <rect x="86" y="48" width="8" height="48" rx="1" fill="url(#accent)" opacity="0.85"/>

  <!-- Fracture gap -->
  <rect x="96" y="104" width="6" height="8" rx="1" fill="url(#accent)" opacity="0.3"/>

  <!-- Block group 2: descending slices right -->
  <rect x="104" y="44" width="8" height="52" rx="1" fill="url(#accent)" opacity="0.9"/>
  <rect x="114" y="62" width="8" height="38" rx="1" fill="url(#accent)" opacity="0.8"/>
  <rect x="124" y="78" width="8" height="28" rx="1" fill="url(#accent)" opacity="0.7"/>
  <rect x="134" y="90" width="8" height="20" rx="1" fill="url(#accent)" opacity="0.6"/>
  <rect x="144" y="100" width="8" height="14" rx="1" fill="url(#accent)" opacity="0.5"/>
  <rect x="154" y="112" width="8" height="10" rx="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Offset fracture layer (ghost blocks) -->
  <rect x="42" y="72" width="8" height="14" rx="1" fill="#c4b5fd" opacity="0.12"/>
  <rect x="110" y="36" width="8" height="22" rx="1" fill="#c4b5fd" opacity="0.14"/>
  <rect x="118" y="100" width="8" height="16" rx="1" fill="#c4b5fd" opacity="0.10"/>
  <rect x="148" y="80" width="8" height="18" rx="1" fill="#c4b5fd" opacity="0.11"/>

  <!-- Subtle RL typographic mark -->
  <text x="100" y="164" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="28" font-weight="600" letter-spacing="6" fill="url(#accent)" opacity="0.9">RL</text>

  <!-- Slice/glitch lines -->
  <line x1="68" y1="140" x2="72" y2="140" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <line x1="130" y1="140" x2="134" y2="140" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <line x1="98" y1="130" x2="102" y2="130" stroke="url(#accent)" stroke-width="1" opacity="0.35"/>

  <!-- Top accent bar -->
  <rect x="56" y="26" width="88" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.4"/>

  <!-- Bottom subtle line -->
  <rect x="64" y="172" width="72" height="1.5" rx="0.75" fill="#27272a"/>
</svg>
