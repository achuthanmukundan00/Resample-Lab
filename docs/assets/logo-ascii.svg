<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" fill="none">
  <defs>
    <linearGradient id="toxic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="40%" stop-color="#00ff41"/>
      <stop offset="70%" stop-color="#32cd32"/>
      <stop offset="100%" stop-color="#00cc00"/>
    </linearGradient>
    <linearGradient id="toxicDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowHeavy">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="160" rx="12" fill="#0a0a0a"/>
  <rect width="720" height="160" rx="12" stroke="#39ff14" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Top scanline -->
  <line x1="0" y1="0" x2="720" y2="0" stroke="url(#toxicDim)" stroke-width="1.5"/>

  <!-- ASCII Art: RESAMPLE -->
  <text font-family="'Courier New', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" letter-spacing="0">
