    <tspan x="50" y="70" fill="url(#toxic)" filter="url(#glow)" font-weight="bold">██╔══██╗██╔════╝██╔════╝██╔══██╗████╗ ████║██╔══██╗██║     ██╔════╝    ██║     ██╔══██╗██╔══██╗</tspan>
    <tspan x="50" y="88" fill="url(#toxic)" filter="url(#glow)" font-weight="bold">██████╔╝█████╗  ███████╗███████║██╔████╔██║██████╔╝██║     █████╗      ██║     ███████║██████╔╝</tspan>
    <tspan x="50" y="106" fill="url(#toxic)" filter="url(#glow)" font-weight="bold">██╔══██╗██╔══╝  ╚════██║██╔══██║██║╚██╔╝██║██╔═══╝ ██║     ██╔══╝      ██║     ██╔══██║██╔══██╗</tspan>
    <tspan x="50" y="124" fill="url(#toxic)" filter="url(#glowHeavy)" font-weight="bold">██║  ██║███████╗███████║██║  ██║██║ ╚═╝ ██║██║     ███████╗███████╗    ███████╗██║  ██║██████╔╝</tspan>
    <tspan x="50" y="142" fill="url(#toxic)" filter="url(#glow)" font-weight="bold">╚═╝  ╚═╝╚══════╝╚══════╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝     ╚══════╝╚══════╝    ╚══════╝╚═╝  ╚═╝╚═════╝ </tspan>
  </text>

  <!-- Subtle glitch overlay text -->
  <text font-family="'Courier New', 'SF Mono', monospace" font-size="14" opacity="0.08" fill="#39ff14">
    <tspan x="52" y="72" letter-spacing="2">■■  ■■■  ■  ■■■  ■■  ■■  ■  ■  ■■■■■</tspan>
  </text>
</svg>
