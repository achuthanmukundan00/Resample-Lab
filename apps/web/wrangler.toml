# Cloudflare Pages configuration for Resample-Lab frontend.
# The API backend must run separately (see docs/deployment.md).
#
# The frontend auto-detects the backend URL from the hostname:
#   localhost -> http://localhost:8000
#   deployed  -> https://resample-lab-api.onrender.com
#
# Deploy:
#   npx wrangler pages deploy out --branch main

name = "resample-lab"
compatibility_date = "2025-05-01"
